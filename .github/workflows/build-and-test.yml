name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    strategy:
      matrix:
        node-version: [26.x, 24.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Initialize submodules
        run: git submodule update --init
      - name: Install dependencies
        run: npm ci
      - name: Copy bundled schemas
        # Generates src/schemas/*.json from the json-schema-spec submodule.
        # Required before `check`: the type-aware lint resolves the JSON imports
        # in z-schema-versions.ts, which are absent on a fresh checkout until the
        # build's copy:schemas step runs.
        run: npm run copy:schemas
      - name: Check (lint + format)
        run: npm run check
      - name: Build
        run: npm run build
      # Browser projects run on the 22.x leg only (its coverage run covers node + browsers): they are independent
      # of the Node version, so the other legs run the node project alone.
      - if: matrix.node-version != '22.x'
        name: Tests (node project)
        run: npx vitest run --project node
      - if: matrix.node-version == '22.x'
        name: Tests with coverage
        run: npm run test:coverage
      - if: matrix.node-version == '22.x'
        name: Generate coverage artifacts
        run: npm run coverage:artifacts
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        name: Commit coverage artifacts to PR branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Skip for fork PRs (no push permission) and bot actors (avoid loops)
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Fork PR — skipping coverage commit."
            exit 0
          fi
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Bot actor — skipping coverage commit."
            exit 0
          fi
          # git would read a branch name starting with "-" as an option
          case "$HEAD_REF" in
            -*)
              echo "Branch name starts with '-' — skipping coverage commit."
              exit 0
              ;;
          esac

          # Save artifacts generated on the merge commit
          cp docs/test-coverage.md /tmp/test-coverage.md
          cp README.md /tmp/README.md

          # Switch to the actual PR branch (force to discard dirty working tree)
          git fetch origin "$HEAD_REF"
          git checkout -f "$HEAD_REF"

          # Restore and format (same as pre-commit hook would)
          cp /tmp/test-coverage.md docs/test-coverage.md
          cp /tmp/README.md README.md
          npx oxfmt -c oxfmt.config.ts --write docs/test-coverage.md README.md

          # Only commit if there are real changes against the branch HEAD
          if git diff --quiet HEAD -- docs/test-coverage.md README.md; then
            echo "Coverage artifacts unchanged. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-coverage.md README.md
          git commit --no-verify -m "chore(ci): update coverage artifacts"
          git push origin "HEAD:$HEAD_REF"
