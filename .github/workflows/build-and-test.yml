name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    strategy:
      matrix:
        node-version: [26.x, 24.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      # persist-credentials: false — this job runs the repository's scripts and never pushes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Initialize submodules
        run: git submodule update --init
      - name: Install dependencies
        run: npm ci
      - name: Copy bundled schemas
        # Generates src/schemas/*.json from the json-schema-spec submodule.
        # Required before `check`: the type-aware lint resolves the JSON imports
        # in z-schema-versions.ts, which are absent on a fresh checkout until the
        # build's copy:schemas step runs.
        run: npm run copy:schemas
      - name: Check (lint + format)
        run: npm run check
      - name: Build
        run: npm run build
      # Browser projects run on the 22.x leg only (its coverage run covers node + browsers): they are independent
      # of the Node version, so the other legs run the node project alone.
      - if: matrix.node-version != '22.x'
        name: Tests (node project)
        run: npx vitest run --project node
      - if: matrix.node-version == '22.x'
        name: Tests with coverage
        run: npm run test:coverage
      - if: matrix.node-version == '22.x'
        name: Generate coverage artifacts
        run: npm run coverage:artifacts
      # The coverage-commit job below commits these two files to the PR branch.
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        name: Format coverage artifacts
        run: npx oxfmt -c oxfmt.config.ts --write docs/test-coverage.md README.md
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-artifacts
          path: |
            docs/test-coverage.md
            README.md
          if-no-files-found: error
          retention-days: 1

  coverage-commit:
    # Commits the coverage artifacts from the build job to the PR branch. It is the only job with write access:
    # it installs nothing and runs no script from the repository. Skipped for fork PRs (no push permission), for
    # the bot's own commits (avoids loops) and for a branch name starting with "-" (git would read it as an option).
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.pull_request.head.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-commit-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-artifacts
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Commit coverage artifacts to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACTS: ${{ runner.temp }}/coverage-artifacts
        run: |
          # The artifacts were generated for HEAD_SHA. If the branch has moved since, leave it to the run for
          # the newer commit.
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "Branch moved since this run started. Skipping commit."
            exit 0
          fi

          cp "$ARTIFACTS/docs/test-coverage.md" docs/test-coverage.md
          cp "$ARTIFACTS/README.md" README.md

          # Only commit if there are real changes against the branch HEAD
          if git diff --quiet HEAD -- docs/test-coverage.md README.md; then
            echo "Coverage artifacts unchanged. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-coverage.md README.md
          git commit --no-verify -m "chore(ci): update coverage artifacts"
          git push origin "HEAD:$HEAD_REF"

  benchmark:
    # Informational only: compares the PR against its base on a shared runner.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: benchmark-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # persist-credentials: false — this job runs the PR's own scripts and never pushes.
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Build head
        run: |
          git submodule update --init
          npm ci
          npm run build
      - name: Build base
        working-directory: base
        run: |
          git submodule update --init
          npm ci
          npm run build
      - name: Benchmark base
        run: node bench/run.mts --lib base/dist/index.js --json base.json
      - name: Benchmark head
        run: node bench/run.mts --json head.json
      - name: Compare
        run: node bench/compare.mts base.json head.json >> "$GITHUB_STEP_SUMMARY"
