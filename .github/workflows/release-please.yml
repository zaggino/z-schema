name: Release Please
concurrency: release_please

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}

      - run: git submodule update --init
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npx playwright install --with-deps
        if: ${{ steps.release.outputs.release_created }}

      # Generates src/schemas/*.json from the json-schema-spec submodule.
      # Required before `check`: the type-aware lint resolves the JSON imports
      # in z-schema-versions.ts, which are absent on a fresh checkout until the
      # build's copy:schemas step runs.
      - run: npm run copy:schemas
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --verbose # runs both build & tests in prepublishOnly script
        if: ${{ steps.release.outputs.release_created }}
