name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user 1001

    strategy:
      matrix:
        node-version: [24.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Initialize submodules
        run: git submodule update --init
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint:check
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
      - if: matrix.node-version != '22.x'
        name: Tests
        run: npm test
      - if: matrix.node-version == '22.x'
        name: Tests with coverage
        run: npm run test:coverage
      - if: matrix.node-version == '22.x'
        name: Generate coverage artifacts
        run: npm run coverage:artifacts
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        id: coverage-decision
        name: Evaluate coverage artifact commit decision
        run: node ./scripts/coverage-update-utils.mts >> $GITHUB_OUTPUT
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        name: Coverage commit decision log
        run: |
          echo "Coverage update reason: ${{ steps.coverage-decision.outputs.reason }}"
          echo "Tracked coverage files changed: ${{ steps.coverage-decision.outputs.changed_files }}"
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request' && steps.coverage-decision.outputs.should_commit == 'true'
        name: Commit coverage artifacts to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-coverage.md README.md
          if git diff --cached --quiet; then
            echo "No staged coverage artifact changes. Skipping commit."
            exit 0
          fi
          git commit -m "chore(ci): update coverage artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }} || {
            echo "Coverage update reason: push_rejected"
            echo "Coverage artifact push rejected."
            exit 1
          }
