name: Skills CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install all skills (local)
        run: |
          npx skills add . --all --copy
          echo "✅ Successfully installed all skills locally"

      - name: Verify skills installed
        run: |
          echo "📁 Checking installed skill files..."
          find .agents/skills -type f -name "SKILL.md" | sort
          echo "---"

          if [ ! -d ".agents/skills" ]; then
            echo "❌ .agents/skills directory not found"
            exit 1
          fi

          count=0
          for skill in .agents/skills/*/; do
            [ -d "$skill" ] || continue
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              echo "✅ Found $skill_name/SKILL.md"
              count=$((count + 1))
            else
              echo "📂 Contents of $skill_name:"
              ls -la "$skill"
              echo "❌ $skill_name/SKILL.md not found"
              exit 1
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "❌ No skills found in .agents/skills/"
            ls -laR .agents/ || true
            exit 1
          fi

          echo "✅ All $count skills successfully installed"

  test-remote:
    runs-on: ubuntu-latest
    # Run only on push to main
    if: github.event_name == 'push'

    steps:
      - name: Install all skills (remote)
        run: |
          npx skills add zaggino/z-schema --all --copy
          echo "✅ Successfully installed all skills from GitHub"

      - name: Verify skills installed
        run: |
          echo "📁 Checking installed skill files..."
          find .agents/skills -type f -name "SKILL.md" | sort
          echo "---"

          if [ ! -d ".agents/skills" ]; then
            echo "❌ .agents/skills directory not found"
            exit 1
          fi

          count=0
          for skill in .agents/skills/*/; do
            [ -d "$skill" ] || continue
            skill_name=$(basename "$skill")
            if [ -f "$skill/SKILL.md" ]; then
              echo "✅ Found $skill_name/SKILL.md"
              count=$((count + 1))
            else
              echo "❌ $skill_name/SKILL.md not found"
              exit 1
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "❌ No skills found in .agents/skills/"
            ls -laR .agents/ || true
            exit 1
          fi

          echo "✅ All $count skills successfully installed"
