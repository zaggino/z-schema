# Git hooks managed by lefthook (replaces husky + lint-staged).
# Installed via the `prepare` npm script (`lefthook install`).

pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
      run: npx oxlint -c oxlint.config.mts --fix {staged_files}
      stage_fixed: true
    oxfmt:
      run: npx oxfmt -c oxfmt.config.mts --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build:
      run: npm run pre-push
