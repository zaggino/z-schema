name: Release Please
concurrency: release_please

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/checkout@v7.0.0
        if: ${{ steps.release.outputs.release_created }}

      - run: git submodule update --init
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7.0.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npx playwright install --with-deps
        if: ${{ steps.release.outputs.release_created }}

      # Generates src/schemas/*.json from the json-schema-spec submodule.
      # Required before `check`: the type-aware lint resolves the JSON imports
      # in z-schema-versions.ts, which are absent on a fresh checkout until the
      # build's copy:schemas step runs.
      - run: npm run copy:schemas
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --verbose # runs both build & tests in prepublishOnly script
        if: ${{ steps.release.outputs.release_created }}
