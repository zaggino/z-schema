name: Release Please
concurrency: release_please

on:
  push:
    branches:
      - main
  # Manual recovery for a release whose GitHub release/tag exists but whose npm
  # publish failed (a re-run sees the release as already created and skips it).
  # With `publish`, dispatch from main: release-please is skipped and main is
  # published, provided its package.json version is tagged and main matches that
  # tag outside .github/. Publishing main itself keeps npm provenance (which
  # records the run's ref and sha) truthful. Without `publish`, it runs
  # release-please as a push to main would.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Skip release-please and publish main to npm (its version must already be tagged)'
        type: boolean
        default: false

# Each job gets only what it needs. The token that can publish to npm (id-token) is held by the publish job
# alone, which installs nothing and runs no script from the repository or its dependencies.
permissions: {}

jobs:
  # On a manual dispatch with `publish` the release step is skipped and the job still succeeds, so `build` can
  # evaluate its own condition.
  release-please:
    runs-on: ubuntu-latest
    # GH_TOKEN is a secret of the `main` environment, so the job has to name that environment to read it. The
    # environment is configured (repository settings) to accept main only: a run from another branch fails here,
    # and `build` and `publish` are skipped with it. The two checks of the ref further down are a backstop in
    # case that setting is ever loosened.
    environment: main
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ !inputs.publish && github.ref == 'refs/heads/main' }}
        with:
          release-type: node
          token: ${{ secrets.GH_TOKEN }}

  # Checks, builds, tests and packs the release. The tarball is handed to the publish job as an artifact.
  # Runs when release-please created a release, or on a manual dispatch with `publish`.
  build:
    needs: release-please
    if: ${{ inputs.publish || needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same image as build-and-test.yml: ships the browsers for the locked
    # Playwright version, so the job doesn't depend on Playwright supporting the
    # runner OS. Keep the tag in sync with build-and-test.yml and the playwright
    # version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the manual-publish guard below compares HEAD with the release tag
          persist-credentials: false

      - name: Guard manual publish
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual publish must be dispatched from main, not $GITHUB_REF"
            exit 1
          fi
          tag="v$(node -p "require('./package.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag does not exist; manual publish only recovers an existing release"
            exit 1
          fi
          if ! git diff --quiet "$tag" HEAD -- . ':(exclude).github'; then
            echo "::error::main differs from $tag outside .github/; refusing to publish it as ${tag#v}"
            git diff --stat "$tag" HEAD -- . ':(exclude).github'
            exit 1
          fi

      - run: git submodule update --init

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Generates src/schemas/*.json from the json-schema-spec submodule.
      # Required before `check`: the type-aware lint resolves the JSON imports
      # in z-schema-versions.ts, which are absent on a fresh checkout until the
      # build's copy:schemas step runs.
      - run: npm run copy:schemas

      - run: npm run check

      # Clean, build and test: what `npm publish` would run before packing. The publish job skips scripts.
      - run: npm run prepublishOnly

      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: z-schema-*.tgz
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed publish job on its own
          overwrite: true # a re-run of this job replaces the artifact of the earlier attempt

  # Publishes the tarball the build job packed. No checkout, no install, no lifecycle scripts.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write # Required for OIDC
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Publish the tarball
        run: |
          set -- ./npm-tarball/z-schema-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one z-schema tarball in the artifact, found: $*"
            exit 1
          fi
          npm publish "$1" --ignore-scripts --verbose
