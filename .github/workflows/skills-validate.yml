name: Skills Validate
concurrency: skills_validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by hand to the main-branch commit of 2026-11-04: Dependabot does not update this ref.
      - name: Checkout agentskills repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agentskills/agentskills
          ref: 83021e2be457a9b6679148719c1f6074f0ad975e
          path: agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'agentskills/skills-ref/pyproject.toml'

      - name: Install skills-ref
        run: |
          cd agentskills/skills-ref
          pip install -e .

      - name: Validate all skills
        run: |
          echo "🔍 Validating all skills..."

          # Find all SKILL.md files and validate their parent directories
          find skills -name "SKILL.md" | while read -r skill_file; do
            skill_dir=$(dirname "$skill_file")
            skill_name=$(basename "$skill_dir")
            
            echo ""
            echo "Validating $skill_name..."
            
            if skills-ref validate "$skill_dir"; then
              echo "✅ $skill_name is valid"
            else
              echo "❌ $skill_name validation failed"
              exit 1
            fi
          done

          echo ""
          echo "✅ All skills validated successfully"
