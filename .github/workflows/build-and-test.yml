name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-and-test-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}-${{ matrix.node-version }}
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user 1001

    strategy:
      matrix:
        node-version: [24.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Initialize submodules
        run: git submodule update --init
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint:check
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
      - if: matrix.node-version != '22.x'
        name: Tests
        run: npm test
      - if: matrix.node-version == '22.x'
        name: Tests with coverage
        run: npm run test:coverage
      - if: matrix.node-version == '22.x'
        name: Generate coverage artifacts
        run: npm run coverage:artifacts
      - if: matrix.node-version == '22.x' && github.event_name == 'pull_request'
        name: Commit coverage artifacts to PR branch
        run: |
          # Skip for fork PRs (no push permission) and bot actors (avoid loops)
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork PR — skipping coverage commit."
            exit 0
          fi
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "Bot actor — skipping coverage commit."
            exit 0
          fi

          # Save artifacts generated on the merge commit
          cp docs/test-coverage.md /tmp/test-coverage.md
          cp README.md /tmp/README.md

          # Switch to the actual PR branch (force to discard dirty working tree)
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git checkout -f ${{ github.event.pull_request.head.ref }}

          # Restore and format (same as pre-commit hook would)
          cp /tmp/test-coverage.md docs/test-coverage.md
          cp /tmp/README.md README.md
          npx prettier --write docs/test-coverage.md README.md

          # Only commit if there are real changes against the branch HEAD
          if git diff --quiet HEAD -- docs/test-coverage.md README.md; then
            echo "Coverage artifacts unchanged. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-coverage.md README.md
          git commit --no-verify -m "chore(ci): update coverage artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
