# Git hooks managed by lefthook (replaces husky + lint-staged).
# Installed via the `prepare` npm script (`lefthook install`).

pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
      run: npx oxlint -c oxlint.config.ts --fix {staged_files}
      stage_fixed: true
    oxfmt:
      # --no-error-on-unmatched-pattern: don't fail the commit when every staged
      # file is excluded by ignore rules (e.g. only CHANGELOG.md was staged).
      run: npx oxfmt -c oxfmt.config.ts --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    build:
      run: npm run pre-push
